<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f3e7"><title>Chat | Gator Board</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script><script src="demo-api.js"></script></head>
<body data-page="chat">
<main class="app-shell chat-page" id="chat-list-view" hidden>
<header class="home-header"><h1>GatorBoard</h1><button class="icon-button notification" type="button" aria-label="Notifications"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span></span></button></header>
<label class="search-box"><span aria-hidden="true"><i class="i i-search" aria-hidden="true"></i></span><input id="chat-search" type="search" placeholder="Search chats..." autocomplete="off" /></label>
<div class="chat-heading"><div><h2>Chats</h2><span id="chat-unread"></span></div></div>
<div class="chat-list" id="chat-list" aria-live="polite"></div>
<p class="empty-state" id="chat-empty" hidden>No chats yet. Open a task and tap Message to start one.</p>
</main>
<main class="app-shell chat-page chat-thread" id="chat-thread-view" hidden>
<header class="home-header"><h1>GatorBoard</h1><button class="icon-button notification" type="button" aria-label="Notifications"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span></span></button></header>
<header class="page-header"><a href="chat.html" aria-label="Back to chats"><i class="i i-chevron-left" aria-hidden="true"></i></a><h1><span id="thread-name"></span><small id="thread-task"></small></h1><span></span></header>
<div class="chat-actions"><button type="button" class="chat-complete" id="show-request">Request details</button><button type="button" class="chat-complete" id="complete-task">Mark task complete</button></div>
<div class="chat-log" id="chat-log" aria-live="polite"></div>
<p class="chat-lock-note" id="chat-lock-note" hidden></p>
<form class="chat-form" id="chat-form"><button type="button" class="chat-tool" id="attach-photo" aria-label="Share a picture"><i class="i i-camera" aria-hidden="true"></i></button><button type="button" class="chat-tool" id="share-location" aria-label="Share your location"><i class="i i-pin" aria-hidden="true"></i></button><input name="message" autocomplete="off" placeholder="Write a message…" aria-label="Message"><button type="submit" class="chat-send" aria-label="Send"><i class="i i-send" aria-hidden="true"></i></button><input type="file" id="photo-input" accept="image/*" hidden></form>
</main>
<div class="sheet" id="request-sheet" role="dialog" aria-label="Request details" hidden><div class="sheet-card"><button type="button" class="sheet-close" data-close aria-label="Close"><i class="i i-x" aria-hidden="true"></i></button><div id="request-details"></div></div></div>
<nav class="bottom-nav" aria-label="Main navigation"><a class="nav-item" href="index.html#home"><span class="nav-icon"><i class="i i-home" aria-hidden="true"></i></span><span>Home</span></a><a class="nav-item" href="map.html"><span class="nav-icon"><i class="i i-map" aria-hidden="true"></i></span><span>Map</span></a><a class="nav-item add-nav" href="add-task.html" aria-label="Add a task"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M2 12h20"/></svg></span></a><a class="nav-item is-current" href="chat.html" aria-current="page"><span class="nav-icon"><i class="i i-chat" aria-hidden="true"></i></span><span>Chat</span></a><a class="nav-item" href="profile.html"><span class="nav-icon"><i class="i i-user" aria-hidden="true"></i></span><span>Profile</span></a></nav><div class="toast" role="status" aria-live="polite"></div></body></html>
