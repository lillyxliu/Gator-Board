<!doctype html>
<html lang = "en">
  <head>
    <meta charset = "utf-8" />
    <meta name = "viewport" content = "width=device-width, initial-scale = 1" />
    <meta name = "theme-color" content = "#ffffff" />
    <title>Log In | Gator Board</title>
    <link rel="stylesheet" href="styles.css" />

    <style>
        .login-form {
          width: 100%;
          max-width: 360px;
          text-align: left;
        }

        .login-form label {
          display: block;
          margin: 14px 0 6px;
          font-weight: 600;
        }

        .login-form .field-control {
          width: 100%;
        }

        .login-form .flow-button {
          width: 100%;
          margin-top: 24px;
          border: none;
          cursor: pointer;
          font: inherit;
          transition: opacity 0.2s ease;
        }

        .login-form .flow-button:hover {
          opacity: 0.8;
        }

        .flow-page .signup-link {
          font-size: 14px;
          margin-top: 14px;
          text-align: center;
        }

        .signup-link a {
          color: #1a73e8;
          font-weight: 600;
        }

        .error-message {
          color: #d32f2f;
          font-size: 0.875rem;
          margin-top: 4px;
        }

        .password-field {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .password-field input {
          flex: 1;
          min-width: 0;
        }

        .show-button {
          border: 1px solid #d9dfd9;
          border-radius: 8px;
          background: #d9dfd9;
          padding: 10px;
          transition: opacity 0.2s ease;
        }
        .show-button.active {
          opacity: 0.4;
        }

        .guest-button {
          display: block;
          min-height: 32px;
          margin: 6px auto 0;
          padding: 4px 12px;
          border: 1px solid #9aa79c;
          border-radius: 8px;
          background: transparent;
          color: #66736a;
          font: 600 12px Inter, system-ui, sans-serif;
          cursor: pointer;
        }

        .guest-button:disabled {
          cursor: wait;
          opacity: 0.6;
        }
    </style>
  <script src="demo-api.js"></script></head>

  <body>
    <main class="flow-page">
      <h1>Gator Board</h1>
      <h2>Log In</h2>

      <form id = "login-form" class = "login-form">
        <label for = "username">Username or UF Email</label>
        <input class = "field-control" type = "text" id = "username" placeholder = "Username or UF Email" required />
        <label for = "password">Password</label>
        <div class = "password-field">
          <input class = "field-control" type = "password" id = "password" placeholder = "Password" required />
          <button class = "show-button" type = "button" target = "password">Show</button>
        </div>
        <p id = "login-error" class = "error-message" role = "alert" hidden></p>
        <button class = "flow-button" type = "submit">Log In</button>
        <p class = "signup-link">Don't have an account? <a href = "signup.html">Sign Up</a></p>
        <button class = "guest-button" type = "button" id = "guest-login">Continue as guest (Dev Showcase Only)</button>
      </form>
    </main>

    <script>
      const form = document.querySelector("#login-form");
      const usernameInput = document.querySelector("#username");
      const passwordInput = document.querySelector("#password");
      const loginError = document.querySelector("#login-error");

    document.querySelectorAll(".show-button").forEach(button => {
      button.addEventListener("click", () => {
        const targetInput = document.getElementById(button.getAttribute("target"));
        const visible = targetInput.type === "password";

        targetInput.type = visible ? "text" : "password";
        button.classList.toggle("active", visible);
        button.setAttribute("aria-pressed", String(visible));
      });
    });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const identifier = usernameInput.value.trim();
        const password = passwordInput.value;

        loginError.hidden = true;

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({identifier, password})
          });

          const result = await response.json();

          if (!response.ok) {
            loginError.textContent = result.error;
            loginError.hidden = false;
            return;
          }

          window.location.href = "welcome.html";
        } catch {
          loginError.textContent = "Unable to connect to server.";
          loginError.hidden = false;
        }
      });

      // Guest accounts are throwaway: they are deleted when you log out.
      const guestButton = document.querySelector("#guest-login");
      guestButton.addEventListener("click", async () => {
        loginError.hidden = true;
        guestButton.disabled = true;
        try {
          const response = await fetch("/api/guest", {method: "POST"});
          const result = await response.json();
          if (!response.ok) {
            loginError.textContent = result.error;
            loginError.hidden = false;
            guestButton.disabled = false;
            return;
          }
          window.location.href = "welcome.html";
        } catch {
          loginError.textContent = "Unable to connect to server.";
          loginError.hidden = false;
          guestButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
