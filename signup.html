<!doctype html>
<html lang = "en">
  <head>
    <meta charset = "utf-8" />
    <meta name = "viewport" content = "width=device-width, initial-scale = 1" />
    <meta name = "theme-color" content = "#ffffff" />
    <title>Sign up | Gator Board</title>
    <link rel = "stylesheet" href = "styles.css" />
  <style>
    .signup-form {
      width: 100%;
      max-width: 360px;
      text-align: left;
    }

    .signup-form label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
    }

    .signup-form .field-control {
      width: 100%;
    }

    .password-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .password-field input {
      flex: 1;
      min-width: 0;
    }

    .show-button {
      border: 1px solid #d9dfd9;
      border-radius: 8px;
      background: #d9dfd9;
      padding: 10px;
      transition: opacity 0.2s ease;
    }

    .show-button.active {
      opacity: 0.4;
    }

    .error-message {
      color: #d32f2f;
      font-size: 0.875rem;
      margin-top: 4px;
    }

    .signup-form .flow-button {
      width: 100%;
      margin-top: 24px;
      border: none;
      cursor: pointer;
      font: inherit;
      transition: opacity 0.2s ease;
    }

    .guest-button {
      width: 100%;
      min-height: 44px;
      margin-top: 10px;
      border: 2px solid var(--green);
      border-radius: 8px;
      background: transparent;
      color: var(--green);
      font: inherit;
      cursor: pointer;
    }

    .guest-button:disabled {
      cursor: wait;
      opacity: 0.6;
    }
  </style>
<script src="demo-api.js"></script></head>

<body>
  <main class = "flow-page">
    <a class = "back-link" href = "login.html" aria-label = "Back to sign in">‹ Back to Sign In</a>
    <h1>Gator Board</h1>
    <h2>Create Account</h2>
    <form id = "signup-form" class = "signup-form">
      <label for = username>Username</label>
      <input class = "field-control" type = "text" id = "username" placeholder = "Username required" minlength = "3" maxlength = "20" required />
      <p id = "username-error" class = "error-message" role = "alert" hidden></p>

      <label for = email>Email</label>
      <input class = "field-control" type = "email" id = "email" placeholder = "Email required" required />
      <p id = "email-error" class = "error-message" role = "alert" hidden></p>

      <label for = password>Password</label>
      <div class = "password-field">
        <input class = "field-control" type = "password" id = "password" placeholder = "Password required" minlength = "8" required />
        <button class = "show-button" type = "button" target = "password">Show</button>
      </div>
      <p id = "password-error" class = "error-message" role = "alert" hidden></p>

      <label for = confirm-password>Confirm Password</label>
      <div class = "password-field">
        <input class = "field-control" type = "password" id = "confirm-password" placeholder = "Confirm password" minlength = "8" required />
        <button class = "show-button" type = "button" target = "confirm-password">Show</button>
      </div>
      <p id = "confirm-password-error" class = "error-message" role = "alert" hidden></p>

      <button class = "flow-button" type = "submit">Sign Up</button>
      <button class = "guest-button" type = "button" id = "guest-login">Continue as guest</button>
    </form>
  </main>

  <script>
    const form = document.querySelector("#signup-form");
    const usernameInput = document.querySelector("#username");
    const emailInput = document.querySelector("#email");
    const passwordInput = document.querySelector("#password");
    const confirmPasswordInput = document.querySelector("#confirm-password");

    function showError(id, message) {
      const errorElement = document.getElementById(id);
      errorElement.textContent = message;
      errorElement.hidden = !message;
    }

    document.querySelectorAll(".show-button").forEach(button => {
      button.addEventListener("click", () => {
        const targetInput = document.getElementById(button.getAttribute("target"));
        const visible = targetInput.type === "password";

        targetInput.type = visible ? "text" : "password";
        button.classList.toggle("active", visible);
        button.setAttribute("aria-pressed", String(visible));
      });
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      let valid = true;

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        showError("username-error", "Username must be 3-20 characters long, and can only contain letters, numbers, and underscores.");
        valid = false;
      } else {
        showError("username-error", "");
      }

      if (!/^[^\s@]+@ufl\.edu$/.test(email)) {
        showError("email-error", "Please enter a valid University of Florida email address.");
        valid = false;
      } else {
        showError("email-error", "");
      }

      if (password.length < 8) {
        showError("password-error", "Password must be at least 8 characters long.");
        valid = false;
      } else {
        showError("password-error", "");
      }

      if (password !== confirmPassword) {
        showError("confirm-password-error", "Passwords do not match.");
        valid = false;
      } else {
        showError("confirm-password-error", "");
      }

      if (!valid) return;

      try {
        const response = await fetch("/api/signup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({username, email, password})
        });

        const result = await response.json();

        if (!response.ok) {
          showError("email-error", result.error);
          return;
        }

        window.location.href = "welcome.html";
      } catch {
        console.error("Signup error:", error);
        showError("email-error", "Unable to connect to server.");
      }
    });

    // Guest accounts are throwaway: they are deleted when you log out.
    const guestButton = document.querySelector("#guest-login");
    guestButton.addEventListener("click", async () => {
      showError("email-error", "");
      guestButton.disabled = true;
      try {
        const response = await fetch("/api/guest", {method: "POST"});
        const result = await response.json();
        if (!response.ok) {
          showError("email-error", result.error);
          guestButton.disabled = false;
          return;
        }
        window.location.href = "welcome.html";
      } catch {
        showError("email-error", "Unable to connect to server.");
        guestButton.disabled = false;
      }
    });
  </script>
</body>
</html>
