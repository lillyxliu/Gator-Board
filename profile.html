<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f3e7" />
    <title>Profile | Gator Board</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="profile">
    <main class="app-shell profile-page">
      <header class="page-header">
        <a href="index.html#home" aria-label="Back to home">‹</a>
        <h1>Profile</h1>
        <span></span>
      </header>
      <section class="profile-summary" id="profile-summary" aria-live="polite">
        <div class="profile-avatar"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="5"/><path d="M2 23a10 10 0 0 1 20 0"/></svg></div>
        <h2>Loading profile…</h2>
      </section>
      <section class="profile-reviews" aria-labelledby="reviews-heading">
        <h2 id="reviews-heading">Reviews</h2>
        <div id="review-list" class="review-list"></div>
      </section>
      <button class="secondary-button profile-logout" id="logout-button" type="button">Log Out</button>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <a class="nav-item" href="index.html#home"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-8 9 8v12h-6v-8H9v8H3V10Z"/></svg></span><span>Home</span></a>
      <a class="nav-item" href="map.html"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 12-9 12S3 17 3 10a9 9 0 1 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg></span><span>Map</span></a>
      <a class="nav-item add-nav" href="add-task.html" aria-label="Add a task"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M2 12h20"/></svg></span></a>
      <button class="nav-item" type="button" data-placeholder="Chat"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3h-7l-6 3v-3H5a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z"/><circle cx="7" cy="11" r=".6"/><circle cx="12" cy="11" r=".6"/><circle cx="17" cy="11" r=".6"/></svg></span><span>Chat</span></button>
      <a class="nav-item is-current" href="profile.html"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="5"/><path d="M2 23a10 10 0 0 1 20 0"/></svg></span><span>Profile</span></a>
    </nav>
    <div class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
