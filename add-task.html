<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f3e7"><title>Add Task | Gator Board</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body data-page="add"><main class="app-shell form-page"><header class="page-header"><a href="index.html#home" aria-label="Back to home">‹</a><h1>Add Task</h1><span></span></header><form id="task-form" novalidate>
<label class="form-label">Task title<span>*</span><input name="title" required placeholder="Pick up groceries from Publix"></label>
<fieldset><legend>Category<span>*</span></legend><div class="form-categories"><label><input type="radio" name="category" value="Errand" checked><span>♧</span>Errand</label><label><input type="radio" name="category" value="Food"><span>♜</span>Food</label><label><input type="radio" name="category" value="Study"><span>▭</span>Study</label><label><input type="radio" name="category" value="Delivery"><span>◇</span>Delivery</label><label><input type="radio" name="category" value="Other"><span>•••</span>Other</label></div></fieldset>
<label class="form-label">Description<span>*</span><textarea name="description" required placeholder="Add more details (e.g. exact items, meeting point)…"></textarea></label>
<label class="inline-field"><strong>Location<span>*</span></strong><span class="field-control">⌖<input name="location" required placeholder="Select location"></span></label>
<label class="inline-field"><strong>Preferred time<span>*</span></strong><span class="field-control">▣<input name="time" required placeholder="e.g. Tomorrow, 3:00 PM"></span></label>
<div class="inline-field"><strong>Reward<span>*</span></strong><span class="reward-controls"><span class="reward-toggle">$ &nbsp; money</span><label class="amount-control">$<input name="reward" required type="number" min="0" step="1" placeholder="Enter amount"></label></span></div>
<label class="photo-field"><strong>Add a photo (optional)</strong><input name="photo" type="file" accept="image/*"><span>▧<b>Add a photo (optional)</b></span></label>
<div class="form-actions"><button class="secondary-button" type="button" id="save-draft">Save Draft</button><button class="primary-button" type="submit">Review&nbsp; →</button></div></form></main>
<nav class="bottom-nav" aria-label="Main navigation"><a class="nav-item" href="index.html#home"><span class="nav-icon">⌂</span><span>Home</span></a><a class="nav-item" href="map.html"><span class="nav-icon">⌖</span><span>Map</span></a><a class="nav-item add-nav" href="add-task.html" aria-current="page"><span>＋</span></a><button class="nav-item" type="button" data-placeholder="Chat"><span class="nav-icon">▢</span><span>Chat</span></button><button class="nav-item" type="button" data-placeholder="Profile"><span class="nav-icon">♙</span><span>Profile</span></button></nav><div class="toast" role="status" aria-live="polite"></div></body></html>
