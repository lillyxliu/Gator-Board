<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f3e7"><title>Add Task | Gator Board</title><link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css"><link rel="stylesheet" href="styles.css"><script src="vendor/maplibre/maplibre-gl.js" defer></script><script src="vendor/maplibre/pmtiles.js" defer></script><script src="vendor/maplibre/basemaps.js" defer></script><script src="app.js" defer></script></head>
<body data-page="add"><main class="app-shell form-page"><header class="page-header"><a href="index.html#home" aria-label="Back to home">‹</a><h1>Add Task</h1><span></span></header><form id="task-form" novalidate>
<label class="form-label">Task title<span>*</span><input name="title" required placeholder="Pick up groceries from Publix"></label>
<fieldset><legend>Category<span>*</span></legend><div class="form-categories"><label><input type="radio" name="category" value="Errand" checked><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg></span>Errand</label><label><input type="radio" name="category" value="Food"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M20 3c-5 1-5 11 0 11V3Zm0 11v7"/></svg></span>Food</label><label><input type="radio" name="category" value="Study"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5C8 2 4 3 2 4v16c3-2 7-2 10 0 3-2 7-2 10 0V4c-3-2-7-2-10 1Zm0 0v15"/></svg></span>Study</label><label><input type="radio" name="category" value="Delivery"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 10 5-10 6L2 7l10-5Zm-10 5v10l10 5 10-5V7M12 13v9M7 4.5l10 5v6"/></svg></span>Delivery</label><label><input type="radio" name="category" value="Other"><span>•••</span>Other</label></div></fieldset>
<label class="form-label">Description<span>*</span><textarea name="description" required placeholder="Add more details (e.g. exact items, meeting point)…"></textarea></label>
<label class="inline-field"><strong>Location<span>*</span></strong><span class="field-control"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 12-9 12S3 17 3 10a9 9 0 1 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg><input name="location" required placeholder="Search a place, e.g. Little Hall" autocomplete="off"></span></label>
<div class="location-picker"><ul class="location-suggestions" id="location-suggestions" role="listbox" aria-label="Matching places" hidden></ul><div id="location-map" role="region" aria-label="Pick the task location on the map"></div><div class="pin-row"><span id="pin-status">Search a place above, or tap the map to drop a pin.</span><button type="button" class="pin-button" id="use-my-location"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 12-9 12S3 17 3 10a9 9 0 1 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg> Use my location</button></div><input type="hidden" name="lat"><input type="hidden" name="lng"></div>
<label class="inline-field"><strong>Preferred time<span>*</span></strong><span class="field-control"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 2v6M17 2v6M3 11h18"/></svg><input name="time" required placeholder="e.g. Tomorrow, 3:00 PM"></span></label>
<label class="inline-field"><strong>Estimated duration (minutes)<span>*</span></strong><span class="field-control"><input name="durationMinutes" type="number" min="1" max="10080" step="1" required placeholder="e.g. 15" aria-label="Estimated duration in minutes"></span></label>
<div class="inline-field"><strong>Reward<span>*</span></strong><span class="reward-controls"><span class="reward-toggle">$ &nbsp; money</span><label class="amount-control">$<input name="reward" required type="number" min="0" step="1" placeholder="Enter amount"></label></span></div>
<label class="photo-field"><strong>Add a photo (optional)</strong><input name="photo" type="file" accept="image/*"><span>▧<b>Add a photo (optional)</b></span></label>
<div class="form-actions"><button class="secondary-button" type="button" id="save-draft">Save Draft</button><button class="primary-button" type="submit">Review&nbsp; →</button></div></form></main>
<nav class="bottom-nav" aria-label="Main navigation"><a class="nav-item" href="index.html#home"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-8 9 8v12h-6v-8H9v8H3V10Z"/></svg></span><span>Home</span></a><a class="nav-item" href="map.html"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 12-9 12S3 17 3 10a9 9 0 1 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg></span><span>Map</span></a><a class="nav-item add-nav" href="add-task.html" aria-current="page"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M2 12h20"/></svg></span></a><button class="nav-item" type="button" data-placeholder="Chat"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3h-7l-6 3v-3H5a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z"/><circle cx="7" cy="11" r=".6"/><circle cx="12" cy="11" r=".6"/><circle cx="17" cy="11" r=".6"/></svg></span><span>Chat</span></button><a class="nav-item" href="profile.html"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="5"/><path d="M2 23a10 10 0 0 1 20 0"/></svg></span><span>Profile</span></a></nav><div class="toast" role="status" aria-live="polite"></div></body></html>
