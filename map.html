<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f3e7"><title>Map | Gator Board</title><link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css"><link rel="stylesheet" href="styles.css"><script src="vendor/maplibre/maplibre-gl.js" defer></script><script src="vendor/maplibre/pmtiles.js" defer></script><script src="vendor/maplibre/basemaps.js" defer></script><script src="app.js" defer></script><script src="demo-api.js"></script></head>
<body data-page="map"><main class="app-shell map-page">
<header class="home-header"><h1>GatorBoard</h1><button class="icon-button notification" type="button" aria-label="Notifications"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span></span></button></header>
<label class="search-box"><span aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="m16 16 6 6"/></svg></span><input id="task-search" type="search" placeholder="Search tasks, e.g. groceries, notes…" autocomplete="off" /></label>

<div class="map-filters-wrap"><div class="map-filters" role="group" aria-label="Filter requests"><button type="button" class="map-chip is-selected" data-category="all" aria-pressed="true">All nearby</button><button type="button" class="map-chip" data-category="Errand" aria-pressed="false">Errand</button><button type="button" class="map-chip" data-category="Food" aria-pressed="false">Food</button><button type="button" class="map-chip" data-category="Study" aria-pressed="false">Study</button><button type="button" class="map-chip" data-category="Delivery" aria-pressed="false">Delivery</button></div><button type="button" class="map-more" aria-label="Scroll filters" hidden>›</button></div>
<div id="campus-map" role="region" aria-label="Map of requests near campus"></div>
</main>
