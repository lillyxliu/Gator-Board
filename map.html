<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f3e7"><title>Map | Gator Board</title><link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css"><link rel="stylesheet" href="styles.css"><script src="vendor/maplibre/maplibre-gl.js" defer></script><script src="vendor/maplibre/pmtiles.js" defer></script><script src="vendor/maplibre/basemaps.js" defer></script><script src="app.js" defer></script></head>
<body data-page="map"><main class="app-shell map-page">
<header class="home-header"><h1>GatorBoard</h1><button class="icon-button notification" type="button" aria-label="Notifications">♧<span></span></button></header>
<label class="search-box"><span aria-hidden="true">⌕</span><input id="task-search" type="search" placeholder="Search tasks, e.g. groceries, notes…" autocomplete="off" /></label>
<div class="map-kind" role="group" aria-label="Show"><button type="button" class="map-kind-button is-selected" data-kind="trades" aria-pressed="true">Trades</button><button type="button" class="map-kind-button" data-kind="tasks" aria-pressed="false">Tasks</button></div>
<div class="map-filters" role="group" aria-label="Filter requests"><button type="button" class="map-chip is-selected" data-category="all" aria-pressed="true">All nearby</button><button type="button" class="map-chip" data-category="Errand" aria-pressed="false">Errand</button><button type="button" class="map-chip" data-category="Food" aria-pressed="false">Food</button><button type="button" class="map-chip" data-category="Study" aria-pressed="false">Study</button><button type="button" class="map-chip" data-category="Delivery" aria-pressed="false">Delivery</button></div>
<div id="campus-map" role="region" aria-label="Map of requests near campus"></div>
</main>
<nav class="bottom-nav" aria-label="Main navigation"><a class="nav-item" href="index.html#home"><span class="nav-icon">⌂</span><span>Home</span></a><a class="nav-item is-current" href="map.html" aria-current="page"><span class="nav-icon">⌖</span><span>Map</span></a><a class="nav-item add-nav" href="add-task.html" aria-label="Add a task"><span>＋</span></a><button class="nav-item" type="button" data-placeholder="Chat"><span class="nav-icon">▢</span><span>Chat</span></button><button class="nav-item" type="button" data-placeholder="Profile"><span class="nav-icon">♙</span><span>Profile</span></button></nav><div class="toast" role="status" aria-live="polite"></div></body></html>
