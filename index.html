<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Gator Board mobile app."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Gator Board</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="flow-page" id="welcome-screen">
      <a class="flow-button" href="signup.html">Log in / Sign up</a>
    </main>

    <div class="app-shell" hidden>
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="Gator Board welcome">
          <span class="brand-mark" aria-hidden="true">G</span>
          <span>gator<span class="brand-light">board</span></span>
        </a>
      </header>

      <main class="screens" id="screens">
        <section class="screen is-active" id="home-screen" data-screen="home" aria-label="Home content">
          <!-- Add home content here. -->
        </section>
        <section class="screen" id="maps-screen" data-screen="maps" aria-label="Maps content" hidden>
          <!-- Add maps content here. -->
        </section>
        <section class="screen" id="post-screen" data-screen="post" aria-label="New post content" hidden>
          <!-- Add new post content here. -->
        </section>
        <section class="screen" id="chat-screen" data-screen="chat" aria-label="Chat content" hidden>
          <!-- Add chat content here. -->
        </section>
        <section class="screen" id="profile-screen" data-screen="profile" aria-label="Profile content" hidden>
          <!-- Add profile content here. -->
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item is-current" type="button" data-view="home" aria-current="page">
          <span class="nav-icon" aria-hidden="true">⌂</span>
          <span>Home</span>
        </button>
        <button class="nav-item" type="button" data-view="maps">
          <span class="nav-icon" aria-hidden="true">▦</span>
          <span>Maps</span>
        </button>
        <button class="nav-item" type="button" data-view="post">
          <span class="nav-icon" aria-hidden="true">▦</span>
          <span>New Post</span>
        </button>
        <button class="nav-item" type="button" data-view="chat">
          <span class="nav-icon" aria-hidden="true">♡</span>
          <span>Chat</span>
        </button>
        <button class="nav-item" type="button" data-view="profile">
          <span class="nav-icon" aria-hidden="true">◉</span>
          <span>Profile</span>
        </button>
      </nav>
    </div>
  </body>
</html>
