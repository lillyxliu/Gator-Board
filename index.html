<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Find and post tasks around the University of Florida." />
    <meta name="theme-color" content="#f8f3e7" />
    <title>Home | Gator Board</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="home">
    <main class="flow-page" id="welcome-screen">
      <h1>Gator Board</h1>
      <p>UF students helping UF students.</p>
      <a class="flow-button" href="login.html">Open GatorBoard App</a>
      <a class="text-link" href="#home">Continue to demo</a>
    </main>
    <main class="app-shell home-page" id="home-app" hidden>
      <header class="home-header"><h1>GatorBoard</h1><button class="icon-button notification" type="button" aria-label="Notifications">♧<span></span></button></header>
      <label class="search-box"><span aria-hidden="true">⌕</span><input id="task-search" type="search" placeholder="Search tasks, e.g. groceries, notes…" autocomplete="off" /></label>
      <section class="category-strip" aria-label="Task categories">
        <button class="category-button is-selected" type="button" data-category="All"><span>▦</span>All</button>
        <button class="category-button" type="button" data-category="Errand"><span>♧</span>Errand</button>
        <button class="category-button" type="button" data-category="Food"><span>♜</span>Food</button>
        <button class="category-button" type="button" data-category="Study"><span>▭</span>Study</button>
        <button class="category-button" type="button" data-category="Delivery"><span>◇</span>Delivery</button>
      </section>
      <section class="task-section">
        <div class="section-heading"><h2>Nearby Tasks</h2><button type="button" id="my-tasks">My Tasks ›</button></div>
        <div class="task-list" id="task-list" aria-live="polite"></div>
        <p class="empty-state" id="empty-state" hidden>No tasks match your search.</p>
      </section>
    </main>
    <nav class="bottom-nav" id="home-nav" aria-label="Main navigation" hidden>
      <a class="nav-item is-current" href="index.html#home" aria-current="page"><span class="nav-icon">⌂</span><span>Home</span></a>
      <a class="nav-item" href="map.html"><span class="nav-icon">⌖</span><span>Map</span></a>
      <a class="nav-item add-nav" href="add-task.html" aria-label="Add a task"><span>＋</span></a>
      <button class="nav-item" type="button" data-placeholder="Chat"><span class="nav-icon">▢</span><span>Chat</span></button>
      <button class="nav-item" type="button" data-placeholder="Profile"><span class="nav-icon">♙</span><span>Profile</span></button>
    </nav>
    <div class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
