<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Find and post tasks around the University of Florida." />
    <meta name="theme-color" content="#f8f3e7" />
    <title>Home | Gator Board</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="home">
    <main class="flow-page" id="welcome-screen">
      <h1>Gator Board</h1>
      <p>UF students helping UF students.</p>
      <a class="flow-button" href="login.html">Open GatorBoard App</a>
      <a class="text-link" href="#home">Continue to demo</a>
    </main>
    <main class="app-shell home-page" id="home-app" hidden>
      <header class="home-header"><h1>GatorBoard</h1></header>
      <label class="search-box"><span aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="m16 16 6 6"/></svg></span><input id="task-search" type="search" placeholder="Search tasks, e.g. groceries, notes…" autocomplete="off" /></label>
      <section class="category-strip" aria-label="Task categories">
        <button class="category-button is-selected" type="button" data-category="All"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/></svg></span>All</button>
        <button class="category-button" type="button" data-category="Errand"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg></span>Errand</button>
        <button class="category-button" type="button" data-category="Food"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M20 3c-5 1-5 11 0 11V3Zm0 11v7"/></svg></span>Food</button>
        <button class="category-button" type="button" data-category="Study"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5C8 2 4 3 2 4v16c3-2 7-2 10 0 3-2 7-2 10 0V4c-3-2-7-2-10 1Zm0 0v15"/></svg></span>Study</button>
        <button class="category-button" type="button" data-category="Delivery"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 10 5-10 6L2 7l10-5Zm-10 5v10l10 5 10-5V7M12 13v9M7 4.5l10 5v6"/></svg></span>Delivery</button>
      </section>
      <section class="task-section">
        <div class="section-heading"><h2>Nearby Tasks</h2><button type="button" id="my-tasks">My Tasks ›</button></div>
        <div class="task-list" id="task-list" aria-live="polite"></div>
        <p class="empty-state" id="empty-state" hidden>No tasks match your search.</p>
      </section>
    </main>
    <nav class="bottom-nav" id="home-nav" aria-label="Main navigation" hidden>
      <a class="nav-item is-current" href="index.html#home" aria-current="page"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-8 9 8v12h-6v-8H9v8H3V10Z"/></svg></span><span>Home</span></a>
      <a class="nav-item" href="map.html"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 12-9 12S3 17 3 10a9 9 0 1 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg></span><span>Map</span></a>
      <a class="nav-item add-nav" href="add-task.html" aria-label="Add a task"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M2 12h20"/></svg></span></a>
      <button class="nav-item" type="button" data-placeholder="Chat"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3h-7l-6 3v-3H5a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z"/><circle cx="7" cy="11" r=".6"/><circle cx="12" cy="11" r=".6"/><circle cx="17" cy="11" r=".6"/></svg></span><span>Chat</span></button>
      <a class="nav-item" href="profile.html"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="5"/><path d="M2 23a10 10 0 0 1 20 0"/></svg></span><span>Profile</span></a>
    </nav>
    <div class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
